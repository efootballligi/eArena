<script>
/* ===== WEKA FUNGUO ZAKO HAPA (Supabase > Project Settings > API) ===== */
const SUPABASE_URL='https://ttwivplvoevhhcsxkdfu.supabase.co';
const SUPABASE_KEY='sb_publishable_pmqJ8MzvjRhlSLsJQtgfYg_OqLCIK_R';
/* ===================================================================== */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),V=i=>document.getElementById(i).value;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tsh=n=>'TSh '+Math.round(n||0).toLocaleString('en-US');
const rank=x=>x<100?'Bronze':x<300?'Silver':x<600?'Gold':'Legend';
const dt=t=>new Date(t).toLocaleDateString('sw-TZ',{day:'numeric',month:'short'});
const nm=i=>i?esc(D.lb?.find(u=>u.id==i)?.username||D.users?.find(u=>u.id==i)?.username||'?'):'BYE';
let D={},sess=null,view='home',arg=null,adm=false,atab='sum',flt='all',ch=null;
const refc=(new URLSearchParams(location.search).get('ref')||'').toUpperCase();let amode=refc?'reg':'login';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),Math.max(2600,t.length*90))}
function ask(title,def,cb){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class="card"><b>${title}</b><input id="mi" value="${esc(def)}"><div class="rw"><button class="btn gh" id="mx">Ghairi</button><button class="btn" id="mo">Sawa</button></div></div>`;document.body.appendChild(m);$('#mi').focus();$('#mx').onclick=()=>m.remove();$('#mo').onclick=()=>{const v=$('#mi').value;m.remove();cb(v)}}
async function rpc(fn,args,ok){const{error}=await sb.rpc(fn,args);if(error){toast(error.message);return false}if(ok)toast(ok);await load();return true}
sb.auth.onAuthStateChange((e,s)=>{sess=s;setTimeout(load,0)});
function sub(){if(ch)return;let t,t2;ch=sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},e=>{if(e.table=='chat_messages'){clearTimeout(t2);t2=setTimeout(loadChat,200)}else{clearTimeout(t);t=setTimeout(load,400)}}).subscribe()}
const chatQ=()=>sb.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(100);
async function loadChat(){const{data}=await chatQ();D.chat=(data||[]).reverse();if(view=='chat'&&$('#msgs'))updMsgs()}
async function load(){
if(!sess){D={};if(ch){sb.removeChannel(ch);ch=null}return draw()}
const q=t=>sb.from(t).select('*'),o={ascending:false};
const [p,t,tp,m,lb,lt,tx,n,s,rf,an,ad,cd,ct,fq,ti]=await Promise.all([q('profiles').eq('id',sess.user.id).single(),q('tournaments').order('created_at',o),q('tournament_players'),q('matches').order('created_at'),q('leaderboard').order('xp',o),q('league_table'),q('transactions').order('created_at',o),q('notifications').order('created_at',o),q('settings').single(),sb.rpc('my_referrals'),q('announcements').order('created_at',o).limit(20),q('ads').order('sort').order('created_at',o),q('tournament_codes'),chatQ(),q('faqs').order('sort'),q('top_inviters').order('total',o).order('first_at')]);
D={me:p.data,tours:t.data||[],tp:tp.data||[],ms:m.data||[],lb:lb.data||[],lt:lt.data||[],tx:tx.data||[],nt:n.data||[],set:s.data||{},rf:rf.data||[],an:an.data||[],ad:ad.data||[],codes:cd.data||[],chat:(ct.data||[]).reverse(),faq:fq.data||[],inv:ti.data||[]};
if(D.me?.role=='admin'){D.users=(await q('profiles').order('created_at',o)).data||[]}
sub();draw()}
function go(v,a){view=v;arg=a;adm=false;if(v=='notif'&&D.nt.some(n=>!n.is_read))sb.from('notifications').update({is_read:true}).eq('user_id',sess.user.id).then(()=>{});draw();scrollTo(0,0)}
let taps=[];$('#logo').onclick=()=>{const n=Date.now();taps=taps.filter(t=>n-t<3000);taps.push(n);if(taps.length>=5){taps=[];if(D.me?.role=='admin'){adm=true;draw()}else toast('Huna ruhusa ya admin')}}
function draw(){const A=$('#app');adToggle(!!(sess&&D.me&&!D.me.is_banned&&!adm&&(view=='home'||view=='tours')));
if(!sess){A.innerHTML=auth();$('#nav').innerHTML='';$('#chip').innerHTML='';return}
if(!D.me){A.innerHTML='<p class="mu">Inapakia...</p>';return}
if(D.me.is_banned){A.innerHTML='<div class="card"><h2>Akaunti imezuiwa</h2><p>Wasiliana na admin.</p><button class="btn" onclick="logout()">Toka</button></div>';return}
if(adm){A.innerHTML=admin();$('#nav').innerHTML='';$('#chip').innerHTML='<button class="btn sm gh" onclick="adm=false;draw()">Toka Admin</button>';return}
const u=D.me,nc=D.nt.filter(n=>!n.is_read).length;
$('#chip').innerHTML=`<span class="tag g">${tsh(u.balance)}</span><button class="btn sm gh" onclick="go('chat')">💬</button><button class="btn sm gh" onclick="go('notif')">🔔 ${nc}</button>`;
const T=[['home','🏠','Nyumbani'],['tours','🏆','Mashindano'],['wallet','💳','Wallet'],['invite','🎁','Alika'],['me','👤','Wasifu']];
$('#nav').innerHTML=T.map(t=>`<button class="${view==t[0]||(view=='t'&&t[0]=='tours')?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
if(view=='chat'&&$('#msgs')){updMsgs();return}A.innerHTML=({home,tours,t:tview,wallet,invite,me:prof,top:topv,notif,chat:chatv})[view]();if(view=='chat'){const e=$('#msgs');if(e)e.scrollTop=e.scrollHeight}}
/* AUTH */
function auth(){const r=amode=='reg';return `<div class="card hero"><h1>${r?'Fungua akaunti':'Karibu tena'}</h1><div>Ligi na mashindano ya eFootball. Cheza, shinda, toa pesa.</div></div>
<div class="card"><label>Email</label><input id="em" type="email" autocomplete="email">
${r?`<label>Jina la mtumiaji</label><input id="rn"><label>eFootball Game ID</label><input id="rg"><label>Namba ya simu</label><input id="rph" inputmode="tel">`:''}
<label>Nywila</label><input id="pw" type="password">${r?`<label>Referral code (si lazima)</label><input id="rr" value="${esc(refc)}">`:''}
<button class="btn" style="width:100%;margin-top:8px" onclick="${r?'reg()':'login()'}">${r?'Jisajili':'Ingia'}</button>
<p class="mu" style="text-align:center;cursor:pointer" onclick="amode='${r?'login':'reg'}';draw()">${r?'Una akaunti? Ingia':'Huna akaunti? Jisajili'}</p></div>`}
async function reg(){const email=V('em').trim(),password=V('pw'),username=V('rn').trim(),game_id=V('rg').trim();
if(!email||!username||!game_id||password.length<6)return toast('Jaza taarifa zote (nywila angalau herufi 6)');
const{data,error}=await sb.auth.signUp({email,password,options:{data:{username,game_id,phone:V('rph').trim(),ref:V('rr').trim()}}});
if(error)return toast(error.message);if(!data.session)toast('Angalia email yako kuthibitisha akaunti')}
async function login(){const{error}=await sb.auth.signInWithPassword({email:V('em').trim(),password:V('pw')});if(error)toast('Email au nywila si sahihi')}
const logout=()=>{view='home';sb.auth.signOut()};
/* HOME & TOURNAMENTS */
const pc=t=>D.tp.filter(p=>p.tournament_id==t.id).length;
function tcard(t){return `<div class="card tap" tabindex="0" onclick="go('t','${t.id}')">${t.image_url?`<img src="${esc(t.image_url)}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:8px">`:''}<div class="rw"><b>${esc(t.title)}</b><span class="tag ${t.status}">${{open:'Wazi',live:'Inaendelea',done:'Imeisha'}[t.status]}</span></div><div class="mu">${t.type=='league'?'Ligi':'Knockout'} · Ada ${t.entry_fee>0?tsh(t.entry_fee):'Bure'}</div>${t.play_at?`<div class="yl" style="font-size:14px">${pt(t)}</div>`:''}<div class="rw" style="margin-top:6px"><span>Zawadi <b class="g">${tsh(t.prize_pool)}</b></span><span class="mu">${pc(t)}/${t.max_players} wachezaji</span></div></div>`}
function home(){const u=D.me,L=D.tours.filter(t=>t.status!='done').slice(0,3);
return `<div class="card hero"><div>Salio lako</div><div class="big">${tsh(u.balance)}</div><div class="rw" style="margin-top:10px"><span>Daraja: ${rank(u.xp)} · XP ${u.xp}</span><button class="btn sm" onclick="go('wallet')">Weka pesa</button></div></div>
${annH()}${adsH()}<h3 style="margin:16px 0 10px">Yanayoendelea sasa</h3>${L.map(tcard).join('')||'<p class="mu">Hakuna mashindano kwa sasa.</p>'}
<button class="btn gh" style="width:100%" onclick="go('top')">Angalia wachezaji bora</button>`}
function tours(){const L=D.tours.filter(t=>flt=='all'||(flt=='free'?!(t.entry_fee>0):t.entry_fee>0));
return `<h2 style="margin-bottom:12px">Mashindano</h2><div class="chips">${[['all','Zote'],['free','Bure'],['paid','Kulipia']].map(f=>`<button class="btn sm ${flt==f[0]?'':'gh'}" onclick="flt='${f[0]}';draw()">${f[1]}</button>`).join('')}</div>${L.map(tcard).join('')||'<p class="mu">Hakuna mashindano yanayolingana.</p>'}${invH()}`}
function tview(){const t=D.tours.find(x=>x.id==arg);if(!t)return '<p class="mu">Haipatikani</p>';const u=D.me,P=D.tp.filter(p=>p.tournament_id==t.id).map(p=>p.user_id),inn=P.includes(u.id),M=D.ms.filter(m=>m.tournament_id==t.id);const N=i=>{if(!i)return 'BYE';const x=D.tp.find(p=>p.tournament_id==t.id&&p.user_id==i);return x?.team_name?esc(x.team_name):N(i)};
let h=`<button class="btn sm gh" onclick="go('tours')">← Rudi</button><div class="card" style="margin-top:12px">${t.image_url?`<img src="${esc(t.image_url)}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:8px">`:''}<h2>${esc(t.title)}</h2>${t.play_at?`<div class="yl">${pt(t)}</div>`:''}<div class="mu">${t.type=='league'?'Ligi (kila mchezaji anakutana na wote)':'Knockout (ukifungwa umetoka)'}</div>
<div class="rw" style="margin-top:8px"><span>Ada: <b>${t.entry_fee>0?tsh(t.entry_fee):'Bure'}</b></span><span>Zawadi: <b class="g">${tsh(t.prize_pool)}</b></span></div>
${t.status=='open'?(inn?'<p class="g">✓ Umejiunga. Subiri admin aanzishe.</p>':`<button class="btn" style="width:100%;margin-top:10px" onclick="join('${t.id}')">Jiunge ${t.entry_fee>0?'· '+tsh(t.entry_fee):''}</button>`):''}
${t.status=='done'?`<p class="yl">🏆 Bingwa: <b>${N(t.winner_id)}</b></p>`:''}</div>
${(()=>{const C=D.codes.find(c=>c.tournament_id==t.id);return C&&inn?`<div class="card"><b>🔑 Code za mchezo</b><div style="white-space:pre-wrap;margin-top:6px">${esc(C.code)}</div></div>`:(!inn&&t.status!='done'?`<div class="card mu">🔒 Code za mchezo zitaonekana ${t.entry_fee>0?'baada ya kujiunga na kulipa ada':'baada ya kujiunga na kuweka jina la timu'}.</div>`:'')})()}<div class="card"><b>Wachezaji (${P.length}/${t.max_players})</b><div class="mu">${P.map(i=>N(i)+' <span class="mu">('+nm(i)+')</span>').join(', ')||'Bado hakuna'}</div></div>`;
const LT=D.lt.filter(r=>r.tournament_id==t.id).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
if(t.type=='league'&&LT.length)h+=`<div class="card tw"><b>Msimamo</b><table><tr><th>#</th><th>Mchezaji</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${LT.map((s,i)=>`<tr><td>${i+1}</td><td>${N(s.user_id)}</td><td>${s.played}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gd}</td><td><b>${s.pts}</b></td></tr>`).join('')}</table></div>`;

return `<div style="padding:9px 0;border-bottom:1px solid var(--s2)"><div class="rw"><span>${t.type=='ko'?'R'+m.round+' · ':''}${N(m.player1)} vs ${N(m.player2)}</span><b>${m.status=='done'?(m.player2?m.score1+' - '+m.score2:'Amepita'):'—'}</b></div>
${m.status=='reported'?'<div class="mu">Matokeo yametumwa, yanasubiri admin.</div>':''}${m.status=='disputed'?'<div class="rd">Lalamiko linashughulikiwa na admin.</div>':''}
${mine?`<div class="mu" style="margin:6px 0">Cheza kisha tuma matokeo (yako kwanza):</div><input id="ra${m.id}" class="sc" type="number" min="0"> - <input id="rb${m.id}" class="sc" type="number" min="0"> <button class="btn sm" onclick="rep('${m.id}')">Tuma</button> <button class="btn sm rdb" onclick="rpc('dispute_match',{p_match:'${m.id}'},'Lalamiko limetumwa')">Lalamika</button>`:''}</div>`}).join('')}</div>`;
return h+invH()}
const join=i=>{const t=D.tours.find(x=>x.id==i);ask(t.entry_fee>0?'Jina la timu yako (ada '+tsh(t.entry_fee)+' itakatwa kwenye wallet)':'Jina la timu yako',  '',v=>{v=v.trim();if(!v)return toast('Weka jina la timu');rpc('join_tournament',{p_id:i,p_team:v},'Umejiunga!')})};

/* WALLET */
function wallet(){const u=D.me,L=D.tx.filter(x=>x.user_id==u.id);
const ic={deposit:'⬇ Deposit',withdraw:'⬆ Withdraw',bonus:'🎁 Bonus',entry:'🎟 Ada',prize:'🏆 Zawadi',adjust:'⚙ Marekebisho'},cl={pending:'yl',approved:'g',rejected:'rd'},lb={pending:'Inasubiri',approved:'Imekubaliwa',rejected:'Imekataliwa'};
const mt='<option>M-Pesa</option><option>Tigo Pesa</option><option>Airtel Money</option><option>HaloPesa</option>';
return `<div class="card hero"><div>Salio</div><div class="big">${tsh(u.balance)}</div></div>

async function dep(){const a=+V('da'),p=V('dp').trim();if(!(a>=500)||!p)return toast('Weka kiasi (angalau 500) na namba ya simu');
const b=$('#db');b.disabled=true;toast('Inatuma ombi...');
const{data,error}=await sb.functions.invoke('abliner-deposit-',{body:{amount:a,phone:p}});
if(error||data?.error){let m=data?.error;if(!m&&error?.context)try{m=(await error.context.json()).error}catch(e){}b.disabled=false;return toast(m||'Imeshindikana, jaribu tena')}
toast(data.message||'Angalia simu yako na uthibitishe');await load();
for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,5000));await sb.functions.invoke('abliner-webhook');await load();if(!D.tx.some(x=>x.type=='deposit'&&x.method=='Abliner'&&x.status=='pending'))break}}
const AUTO_MAX=100000;
async function wd(a,p){toast('Inatuma ombi...');const{data,error}=await sb.functions.invoke('abliner-withdraw',{body:{amount:a,phone:p}});if(error||data?.error){let m=data?.error;if(!m&&error?.context)try{m=(await error.context.json()).error}catch(e){}await load();return toast(m||'Imeshindikana, jaribu tena')}
toast(data.message||'Ombi limetumwa');await load();
for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,5000));await sb.functions.invoke('abliner-webhook');await load();if(!D.tx.some(x=>x.type=='withdraw'&&x.method=='Abliner'&&x.status=='pending'))break}}
function mk(type){const d=type=='deposit',a=+V(d?'da':'wa'),r=V(d?'dr':'wr').trim(),m=V(d?'dm':'wm');if(!(a>0)||!r)return toast('Jaza kiasi na namba');
if(!d&&a<=AUTO_MAX)return wd(a,r);
d?rpc('request_deposit',{p_amount:a,p_method:m,p_ref:r},'Ombi limetumwa'):rpc('request_withdraw',{p_amount:a,p_method:m,p_phone:r},'Ombi limetumwa').then(ok=>{if(ok)setTimeout(()=>showAd(),900)})}

const sm=t=>D.tx.filter(x=>x.type==t&&x.status=='approved').reduce((s,x)=>s+x.amount,0),pend=D.tx.filter(x=>x.status=='pending').length,un=i=>nm(i);let b='';

if(atab=='tr')b=`<div class="card"><b>Unda mashindano</b><input id="nt" placeholder="Jina"><select id="ny"><option value="league">Ligi</option><option value="ko">Knockout</option></select><input id="nf" type="number" placeholder="Ada (0 = bure)"><input id="np" type="number" placeholder="Zawadi (TSh)"><input id="nx" type="number" placeholder="Wachezaji wa juu" value="8"><label>Picha ya mashindano (si lazima)</label><input id="ni" type="file" accept="image/*"><label>Muda wa kucheza (si lazima)</label><input id="nd" type="datetime-local"><button class="btn" style="width:100%" onclick="newT()">Unda</button></div>`+D.tours.map(t=>`<div class="card"><div class="rw"><b>${esc(t.title)}</b><span class="tag ${t.status}">${t.status}</span></div><div class="mu">${pc(t)}/${t.max_players} wachezaji</div><textarea id="tc${t.id}" rows="2" placeholder="Code za mchezo (Room ID, nywila...). Waliojiunga wataziona.">${esc(D.codes.find(c=>c.tournament_id==t.id)?.code||'')}</textarea><button class="btn sm gh" onclick="saveCode('${t.id}')">Hifadhi code</button><div class="mu" style="margin-top:8px">Muda wa kucheza</div><input id="pd${t.id}" type="datetime-local" value="${t.play_at?lt(t.play_at):''}"><button class="btn sm gh" onclick="saveTime('${t.id}')">Hifadhi muda</button><div class="rw" style="margin:8px 0">${t.status=='open'?`<button class="btn sm" onclick="rpc('admin_start_tournament',{p_id:'${t.id}'},'Imeanza')">Anzisha</button>`:'<span></span>'}<button class="btn sm rdb" onclick="delT('${t.id}')">Futa</button></div>
${t.status=='live'?D.ms.filter(m=>m.tournament_id==t.id&&m.status!='done').map(m=>`<div style="padding:8px 0;border-top:1px solid var(--s2)"><div>${nm(m.player1)} vs ${nm(m.player2)} ${m.status=='disputed'?'<span class="rd">⚠ lalamiko</span>':''} ${m.status=='reported'?'<span class="g">· ametuma</span>':''}</div><input id="a${m.id}" class="sc" type="number" value="${m.rep1??''}"> - <input id="b${m.id}" class="sc" type="number" value="${m.rep2??''}"> <button class="btn sm" onclick="conf('${m.id}')">Thibitisha</button></div>`).join(''):''}</div>`).join('');
if(atab=='us')b=D.users.map(u=>`<div class="card"><div class="rw"><b>${esc(u.username)}</b><span>${tsh(u.balance)}</span></div><div class="mu">${esc(u.game_id)} · ${rank(u.xp)}${u.is_banned?' · <span class="rd">amezuiwa</span>':''}${u.role=='admin'?' · admin':''}</div><div class="rw" style="margin-top:8px"><button class="btn sm gh" onclick="bal('${u.id}',${u.balance})">Badili salio</button><button class="btn sm ${u.is_banned?'':'rdb'}" onclick="rpc('admin_set_ban',{p_user:'${u.id}',p_ban:${!u.is_banned}})">${u.is_banned?'Fungua':'Zuia'}</button></div></div>`).join('');
if(atab=='st')b=`<div class="card"><label>Referral bonus (%)</label><input id="s1" type="number" value="${D.set.ref_pct}"><label>Kiwango cha chini cha withdraw</label><input id="s2" type="number" value="${D.set.min_withdraw}"><label>Namba ya kupokea malipo</label><input id="s3" value="${esc(D.set.pay_number)}"><button class="btn" style="width:100%" onclick="saveS()">Hifadhi</button></div><button class="btn gh" style="width:100%" onclick="bc()">Tuma tangazo kwa wote</button>`;
if(atab=='an')b=annAdm();if(atab=='fq')b=fqAdm();if(atab=='ad')b=adAdm();return `<h2 style="margin-bottom:12px">Admin Panel</h2><div class="chips">${T.map(t=>`<button class="btn sm ${atab==t[0]?'':'gh'}" onclick="atab='${t[0]}';draw()">${t[1]}${t[0]=='tx'&&pend?' ('+pend+')':''}</button>`).join('')}</div>${b}`}
async function newT(){const title=V('nt').trim();if(!title)return toast('Weka jina');const u=await upl('ni');if(u===false)return;const d=V('nd');
const{error}=await sb.from('tournaments').insert({title,type:V('ny'),entry_fee:+V('nf')||0,prize_pool:+V('np')||0,max_players:+V('nx')||8,image_url:u?.url||null,play_at:d?new Date(d).toISOString():null});error?toast(error.message):(toast('Mashindano yameundwa'),load())}
const pt=t=>t.play_at?'📅 '+new Date(t.play_at).toLocaleString('sw-TZ',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const lt=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
async function saveTime(i){const d=V('pd'+i);const{error}=await sb.from('tournaments').update({play_at:d?new Date(d).toISOString():null}).eq('id',i);error?toast(error.message):(toast('Muda umehifadhiwa'),load())}

function conf(i){const a=V('a'+i),b=V('b'+i);if(a===''||b==='')return toast('Weka matokeo');rpc('admin_confirm_match',{p_match:i,p_s1:+a,p_s2:+b},'Imethibitishwa')}
const bal=(i,cur)=>ask('Salio jipya (TSh)',cur,v=>{if(!isNaN(+v))rpc('admin_adjust_balance',{p_user:i,p_new:+v},'Imebadilishwa')});
async function saveS(){const{error}=await sb.from('settings').update({ref_pct:+V('s1')||0,min_withdraw:+V('s2')||0,pay_number:V('s3')}).eq('id',1);error?toast(error.message):(toast('Imehifadhiwa'),load())}
const bc=()=>ask('Tangazo','',v=>{if(v)rpc('admin_broadcast',{p_text:v},'Limetumwa')});

/* ===== VIPENGELE VIPYA: matangazo, ads, code, chat ===== */
const tm=t=>new Date(t).toLocaleTimeString('sw-TZ',{hour:'2-digit',minute:'2-digit'});
async function upl(id){const f=document.getElementById(id).files[0];if(!f)return null;if(f.size>50*1024*1024){toast('Faili ni kubwa (max 50MB)');return false}
const ex=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,''),p=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ex;
toast('Inapakia faili...');const{error}=await sb.storage.from('media').upload(p,f,{contentType:f.type});if(error){toast(error.message);return false}
return{url:sb.storage.from('media').getPublicUrl(p).data.publicUrl,type:f.type.startsWith('video')?'video':'image'}}
const annH=()=>D.an.slice(0,2).map(a=>`<div class="card"><div class="mu" style="font-size:11px">📢 TANGAZO · ${dt(a.created_at)}</div>${a.image_url?`<img src="${esc(a.image_url)}" alt="" style="width:100%;border-radius:12px;margin:8px 0">`:''}<b>${esc(a.title)}</b><div>${esc(a.body)}</div></div>`).join('');
const adc=a=>`<div class="card"><div class="mu" style="font-size:11px">MATANGAZO</div>${a.media_type=='video'?`<video src="${esc(a.media_url)}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;margin:8px 0"></video>`:a.media_type=='image'?`<img src="${esc(a.media_url)}" alt="" style="width:100%;border-radius:12px;margin:8px 0">`:''}<b>${esc(a.title)}</b><div>${esc(a.body)}</div>${a.link_url?`<a class="btn sm" style="margin-top:8px" href="${esc(a.link_url)}" target="_blank" rel="noopener">Fungua</a>`:''}</div>`;
const adsH=()=>D.ad.filter(a=>a.active).map(adc).join('');
const annAdm=()=>`<div class="card"><b>Tangazo jipya</b><input id="at" placeholder="Kichwa"><textarea id="ab" rows="3" placeholder="Maelezo"></textarea><label>Picha (si lazima)</label><input id="af" type="file" accept="image/*"><button class="btn" style="width:100%;margin-top:6px" onclick="postAnn()">Tuma kwa wote</button></div>`+D.an.map(a=>`<div class="card"><div class="rw"><b>${esc(a.title)}</b><button class="btn sm rdb" onclick="delAnn('${a.id}')">Futa</button></div>${a.image_url?`<img src="${esc(a.image_url)}" alt="" style="width:100%;border-radius:10px;margin-top:8px">`:''}<div class="mu">${dt(a.created_at)}</div></div>`).join('');
async function postAnn(){const t=V('at').trim();if(!t)return toast('Weka kichwa');const u=await upl('af');if(u===false)return;
const{error}=await sb.from('announcements').insert({title:t,body:V('ab').trim(),image_url:u?.url||null});error?toast(error.message):(toast('Tangazo limetumwa'),load())}
async function delAnn(i){const{error}=await sb.from('announcements').delete().eq('id',i);error?toast(error.message):load()}
const adAdm=()=>`<div class="card"><b>Ad mpya</b><input id="dt" placeholder="Kichwa (jina la biashara)"><textarea id="db2" rows="3" placeholder="Maandishi ya ad"></textarea><input id="dl" placeholder="Link (si lazima, ianze na https://)"><label>Picha au video (si lazima, max 50MB)</label><input id="df" type="file" accept="image/*,video/*"><button class="btn" style="width:100%;margin-top:6px" onclick="postAd()">Weka ad</button></div>`+D.ad.map(a=>`<div class="card"><div class="rw"><b>${esc(a.title)}</b><span class="tag ${a.active?'open':''}">${a.active?'inaonekana':'imezimwa'}</span></div><div class="mu">${a.media_type}</div><div class="rw" style="margin-top:8px"><button class="btn sm gh" onclick="togAd('${a.id}',${!a.active})">${a.active?'Zima':'Washa'}</button><button class="btn sm rdb" onclick="delAd('${a.id}')">Futa</button></div></div>`).join('');
async function postAd(){const t=V('dt').trim();if(!t)return toast('Weka kichwa');const l=V('dl').trim();if(l&&!/^https?:\/\//.test(l))return toast('Link ianze na https://');
const u=await upl('df');if(u===false)return;const{error}=await sb.from('ads').insert({title:t,body:V('db2').trim(),link_url:l||null,media_url:u?.url||null,media_type:u?.type||'text'});error?toast(error.message):(toast('Ad imewekwa'),load())}
async function togAd(i,v){const{error}=await sb.from('ads').update({active:v}).eq('id',i);error?toast(error.message):load()}
async function delAd(i){const{error}=await sb.from('ads').delete().eq('id',i);error?toast(error.message):load()}
async function saveCode(i){const c=V('tc'+i).trim();const{error}=c?await sb.from('tournament_codes').upsert({tournament_id:i,code:c}):await sb.from('tournament_codes').delete().eq('tournament_id',i);error?toast(error.message):(toast('Code zimehifadhiwa'),load())}
const grpH=()=>D.chat.map(m=>`<div style="margin-bottom:10px;${m.is_admin?'border-left:3px solid var(--g);padding-left:8px':''}"><div class="mu" style="font-size:12px">${esc(m.username)}${m.is_admin?' <span class="tag g">Admin</span>':''} · ${tm(m.created_at)}${D.me.role=='admin'?` <a href="#" class="rd" onclick="delM('${m.id}');return false">futa</a>`:''}</div><div style="word-break:break-word">${esc(m.body)}</div></div>`).join('')||'<p class="mu">Hakuna ujumbe bado. Anza mazungumzo!</p>';
const chatv=()=>`<h2>💬 Customer Care</h2><div class="chips"><button class="btn sm ${chatTab=='grp'?'':'gh'}" onclick="setTab('grp')">👥 Group</button><button class="btn sm ${chatTab=='ai'?'':'gh'}" onclick="setTab('ai')">🤖 Msaidizi</button></div>${chatTab=='ai'?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${D.faq.map((f,i)=>`<button class="btn sm gh" onclick="askQ(${i})">${esc(f.question)}</button>`).join('')}</div>`:''}<p class="mu">${chatTab=='ai'?'Chagua swali hapo juu au andika swali lako. Kwa matatizo ya malipo, tumia Group.':'Group la wachezaji na admin. Heshimu wengine.'}</p><div class="card" id="msgs" style="height:50vh;overflow:auto">${msgsH()}</div><div class="rw"><input id="cm" maxlength="500" placeholder="Andika ujumbe..." onkeydown="if(event.key==='Enter')sendM()"><button class="btn" onclick="sendM()">Tuma</button></div>`;
function updMsgs(){const e=$('#msgs');if(!e)return;const low=e.scrollHeight-e.scrollTop-e.clientHeight<80;e.innerHTML=msgsH();if(low)e.scrollTop=e.scrollHeight}
async function sendM(){if(chatTab=='ai')return askAI();const b=V('cm').trim();if(!b)return;const{error}=await sb.from('chat_messages').insert({body:b});if(error)return toast(error.message);$('#cm').value='';await loadChat();const e=$('#msgs');if(e)e.scrollTop=e.scrollHeight}
async function delM(i){const{error}=await sb.from('chat_messages').delete().eq('id',i);error?toast(error.message):loadChat()}

/* ===== MSAIDIZI WA AI ===== */
let chatTab='grp',AI=[],aiBusy=false;
const msgsH=()=>chatTab=='ai'?aiH():grpH();
const aiH=()=>(AI.length?'':'<p class="mu">🤖 Habari! Chagua swali hapo juu, au niulize kuhusu deposit, withdraw, mashindano, referral au code za mchezo.</p>')+AI.map(m=>`<div style="margin-bottom:10px;${m.role=='assistant'?'border-left:3px solid var(--v);padding-left:8px':''}"><div class="mu" style="font-size:12px">${m.role=='assistant'?'🤖 Msaidizi':'Wewe'}</div><div style="white-space:pre-wrap;word-break:break-word">${esc(m.content)}</div></div>`).join('')+(aiBusy?'<div class="mu">🤖 anaandika...</div>':'');
function setTab(t){chatTab=t;$('#app').innerHTML=chatv();const e=$('#msgs');if(e)e.scrollTop=e.scrollHeight}
const nz=t=>String(t).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const fill=t=>t.replace(/\{ref_pct\}/g,D.set.ref_pct??10).replace(/\{min_withdraw\}/g,tsh(D.set.min_withdraw??2000));
function faqAns(q){const n=nz(q);let best=null,bs=0;D.faq.forEach(f=>{let sc=0;f.keywords.split(',').forEach(k=>{const w=nz(k);if(w&&n.includes(w))sc+=w.length});if(sc>bs){bs=sc;best=f}});return best}
function askAI(q){q=(typeof q=='string'?q:V('cm')).trim();if(!q)return;AI.push({role:'user',content:q});const el=$('#cm');if(el)el.value='';const f=faqAns(q);
AI.push({role:'assistant',content:f?fill(f.answer):'Samahani, sijapata jibu la swali hilo. Chagua swali kutoka kwenye orodha hapo juu, au andika kwenye 👥 Group na admin atakusaidia.'});updMsgs();const e=$('#msgs');if(e)e.scrollTop=e.scrollHeight}
const askQ=i=>askAI(D.faq[i].question);
const fqAdm=()=>`<div class="card"><b>Swali na jibu jipya</b><input id="fq1" placeholder="Swali (mfano: Naweka pesa vipi?)"><input id="fq2" placeholder="Maneno ya kutambua, yatenganishe kwa koma (mfano: deposit,weka pesa)"><textarea id="fq3" rows="4" placeholder="Jibu. Unaweza kutumia {ref_pct} na {min_withdraw}"></textarea><button class="btn" style="width:100%" onclick="saveFaq()">Hifadhi</button></div>`+D.faq.map(f=>`<div class="card"><div class="rw"><b>${esc(f.question)}</b><button class="btn sm rdb" onclick="delFaq('${f.id}')">Futa</button></div><div class="mu">${esc(f.keywords)}</div></div>`).join('');
async function saveFaq(){const q=V('fq1').trim(),k=V('fq2').trim(),a=V('fq3').trim();if(!q||!k||!a)return toast('Jaza sehemu zote tatu');const{error}=await sb.from('faqs').insert({question:q,keywords:k,answer:a,sort:D.faq.length+1});error?toast(error.message):(toast('Imehifadhiwa'),load())}
async function delFaq(i){const{error}=await sb.from('faqs').delete().eq('id',i);error?toast(error.message):load()}

/* ===== PWA: sakinisha app kwenye simu ===== */
let dip=null;
const isStd=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function info(h){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class="card"><div>${h}</div><button class="btn" style="width:100%;margin-top:12px">Sawa</button></div>`;document.body.appendChild(m);m.querySelector('button').onclick=()=>m.remove()}
function showInst(){if(isStd()||document.getElementById('inst'))return;if(Date.now()-(+lsGet('inst_dismiss')||0)<3*864e5)return;
const d=document.createElement('div');d.id='inst';d.className='card';d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;margin:0;display:flex;align-items:center;gap:10px';
d.innerHTML=`<img src="icon-192.png" alt="" width="44" height="44" style="border-radius:10px"><div style="flex:1"><b>Pakua app ya eArena</b><div class="mu" style="font-size:13px">Ifungue haraka kutoka kwenye simu yako</div></div><button class="btn sm" onclick="installApp()">Sakinisha</button><button class="btn sm gh" aria-label="Funga" onclick="hideInst(true)">✕</button>`;document.body.appendChild(d)}
function hideInst(dis){const d=document.getElementById('inst');if(d)d.remove();if(dis)lsSet('inst_dismiss',Date.now())}
async function installApp(){if(isStd())return toast('App tayari imesakinishwa');
if(dip){dip.prompt();const r=await dip.userChoice;dip=null;hideInst();if(r.outcome=='accepted')toast('Inasakinisha...');return}
info(isIOS?'<b>iPhone / iPad:</b> fungua kwa <b>Safari</b>, bonyeza kitufe cha <b>Share</b> (⬆) chini, kisha chagua <b>Add to Home Screen</b>.':'Bonyeza menyu ya kivinjari (⋮) juu kulia, kisha chagua <b>Install app</b> au <b>Add to Home screen</b>.')}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;showInst()});
addEventListener('appinstalled',()=>{dip=null;hideInst();toast('App imesakinishwa!')});
if(isIOS&&!isStd())setTimeout(showInst,3000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* ===== ARIFA (WEB PUSH) ===== */
const VAPID_PUBLIC='BHmJflo7ZbzaXFssTLPKeG_ug3YPeFOjvSm00dNycImn8Ac2_RF8blmhUN0zPWMJ-dQ4HZKxusuRrmMoUuNU9_I';
const b64u=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushSub(){try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
const j=sub.toJSON();const{error}=await sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});return !error}catch(e){return false}}
async function enablePush(){if(!('Notification' in window)||!('PushManager' in window))return toast('Kivinjari hiki hakiungi arifa. iPhone: sakinisha app kwanza (Add to Home Screen).');
const p=await Notification.requestPermission();if(p!='granted')return toast('Arifa zimezuiwa. Ziruhusu kwenye mipangilio ya simu.');
toast(await pushSub()?'Arifa zimewashwa!':'Imeshindwa kuwasha arifa');pushUI()}
let pushDone=false;
function pushUI(){let b=document.getElementById('pushbtn');
if(!b){b=document.createElement('button');b.id='pushbtn';b.className='btn sm';b.textContent='🔔 Washa arifa';b.style.cssText='position:fixed;right:12px;bottom:84px;z-index:20;box-shadow:0 2px 10px #0008;display:none';b.onclick=enablePush;document.body.appendChild(b)}
const can=!!(sess&&D.me&&!D.me.is_banned&&!adm&&'Notification' in window&&'PushManager' in window);
b.style.display=can&&Notification.permission=='default'?'block':'none';
if(can&&Notification.permission=='granted'&&!pushDone){pushDone=true;pushSub()}}
const _draw=draw;draw=function(){_draw();pushUI()};
/* ===== INTERSTITIAL (skip baada ya sekunde 5) ===== */
let lastAd=0;
function showAd(next){
  const n=Date.now();
  if(n-lastAd<90000||document.getElementById('advid')||!sess){if(next)next();return}
  lastAd=n;
  const m=document.createElement('div');m.id='advid';m.className='mod';m.style.cssText='flex-direction:column;z-index:80;background:#000d';
  m.innerHTML='<div class="mu" style="margin-bottom:10px">Tangazo</div><div class="card" style="padding:10px;margin:0;width:auto"><iframe src="ad.html" width="320" height="50" scrolling="no" style="border:0;display:block;max-width:100%"></iframe></div><button class="btn gh" id="adsk" disabled style="margin-top:36px">Ruka baada ya 5</button>';
  document.body.appendChild(m);
  let c=5;const t=setInterval(()=>{c--;const b=document.getElementById('adsk');if(!b){clearInterval(t);return}
    if(c>0)b.textContent='Ruka baada ya '+c;
    else{clearInterval(t);b.disabled=false;b.textContent='Ruka ✕';b.onclick=()=>{m.remove();if(next)next()}}},1000)
}
const _go=go;go=function(v,a){const from=view;_go(v,a);if(v=='home'&&from!='home'&&sess&&D.me)showAd()};
/* ===== POPUNDER (inapakiwa mara moja, haimhusu admin) ===== */
let popOn=false;
function loadPop(){
  if(popOn||!sess||!D.me||D.me.role=='admin')return;
  popOn=true;
  const s=document.createElement('script');
  s.src='https://abscloud.org/1/7c9c74964b47db01428e6e14dc5ff041';
  s.setAttribute('data-cfasync','false');
  document.body.appendChild(s);
}
/* ===== ADSTERRA BANNER ===== */
function adToggle(on){
  const b=document.getElementById('adbar');
  if(!b)return;
  if(!on){b.style.display='none';return}
  b.style.display='block';loadPop();
  if(!b.firstChild){
    b.innerHTML='<iframe src="ad.html" width="320" height="50" scrolling="no" style="border:0;display:block;margin:0 auto;max-width:100%"></iframe>';
  }
}
