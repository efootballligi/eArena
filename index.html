async function rpc(fn,args,ok){const{error}=await sb.rpc(fn,args);if(error){toast(error.message);return false}if(ok)toast(ok);await load();return true}

else if(e.table=='support_messages'){if(e.eventType=='INSERT')onSupMsg(e.new);clearTimeout(t3);t3=setTimeout(loadSup,200)}

D={me:p.data,tours:t.data||[],tp:tp.data||[],ms:m.data||[],lb:lb.data||[],lt:lt.data||[],tx:tx.data||[],nt:n.data||[],set:s.data||{},rf:rf.data||[],an:an.data||[],ad:ad.data||[],codes:cd.data||[],chat:(ct.data||[]).reverse(),faq:fq.data||[],plans:kpl.data||[],subs:kss.data||[],tips:ktp.data||[],bl:kbl.data||[]};

/* ---------- Live call (WebRTC voice, signaling via Supabase Realtime) ---------- */
function callCh(room){if(calls[room])return calls[room];
const c={room,state:{}};c.ch=sb.channel('call-'+room,{config:{presence:{key:sess.user.id},broadcast:{self:false}}});
c.ch.on('presence',{event:'sync'},()=>{c.state=c.ch.presenceState();onCallPres(c)}).on('broadcast',{event:'sig'},({payload})=>onSig(c,payload));
c.ready=new Promise(r=>c.ch.subscribe(s=>{if(s=='SUBSCRIBED')r()}));calls[room]=c;return c}
function onCallPres(c){
if(c.room=='group'){const n=Object.keys(c.state).length;if(n>0&&gcPrev==0&&!CALL){const first=Object.values(c.state)[0][0].name||'Mtu';pushNote('📞 Simu ya Live',first+' ameanzisha simu kwenye Group. Gusa kujiunga.',()=>{chatTab='grp';go('chat')})}gcPrev=n;updInfo()}
if(CALL&&CALL.c===c)syncPeers()}
async function joinCall(room,label){
if(CALL){toast('Tayari uko kwenye simu');return false}
if(!navigator.mediaDevices?.getUserMedia){toast('Kifaa hiki hakiruhusu simu');return false}
let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Ruhusu microphone ili kupiga simu');return false}
const c=callCh(room);CALL={c,room,label,stream,muted:false,start:Date.now(),pcs:{},pend:{},st:{},hadPeer:false};
await c.ready;await c.ch.track({name:D.me.username,t:Date.now()});
CALL.tm=setInterval(()=>{const e=$('#ctm');if(e){const s=Math.floor((Date.now()-CALL.start)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000);
callUI();return true}
function iAmInit(k){const st=CALL.c.state,me=sess.user.id;if(!st[me]||!st[k])return false;const a=st[me][0].t,b=st[k][0].t;return a>b||(a==b&&me>k)}
function syncPeers(){if(!CALL)return;const st=CALL.c.state,me=sess.user.id,keys=Object.keys(st).filter(k=>k!=me);
Object.keys(CALL.pcs).forEach(k=>{if(!keys.includes(k))closePeer(k)});
if(keys.length)CALL.hadPeer=true;
keys.forEach(k=>{if(!CALL.pcs[k]&&iAmInit(k))makeOffer(k)});
if(CALL.hadPeer&&!keys.length&&CALL.room!='group'){toast('Simu imeisha');hangup();return}
callUI()}
function getPc(k){let pc=CALL.pcs[k];if(pc)return pc;
pc=new RTCPeerConnection({iceServers:ICE});CALL.pcs[k]=pc;CALL.pend[k]=[];
CALL.stream.getTracks().forEach(t=>pc.addTrack(t,CALL.stream));
pc.onicecandidate=e=>{if(e.candidate)sig(k,'ice',e.candidate.toJSON())};
pc.ontrack=e=>{let a=document.getElementById('au'+k);if(!a){a=document.createElement('audio');a.id='au'+k;a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
pc.onconnectionstatechange=()=>{if(!CALL||CALL.pcs[k]!==pc)return;CALL.st[k]=pc.connectionState;callUI();if(pc.connectionState=='failed'){closePeer(k);setTimeout(()=>{if(CALL)syncPeers()},1500)}};
return pc}
function closePeer(k){if(!CALL)return;const pc=CALL.pcs[k];if(pc){pc.onconnectionstatechange=null;try{pc.close()}catch(e){}}delete CALL.pcs[k];delete CALL.pend[k];delete CALL.st[k];const a=document.getElementById('au'+k);if(a)a.remove();callUI()}
const sig=(to,kind,data)=>{if(CALL)CALL.c.ch.send({type:'broadcast',event:'sig',payload:{to,from:sess.user.id,kind,data}})};
async function makeOffer(k){try{const pc=getPc(k),o=await pc.createOffer();await pc.setLocalDescription(o);sig(k,'offer',{type:o.type,sdp:o.sdp})}catch(e){closePeer(k)}}
async function flush(k){const pc=CALL.pcs[k];while(pc&&CALL.pend[k]&&CALL.pend[k].length){try{await pc.addIceCandidate(CALL.pend[k].shift())}catch(e){}}}
async function onSig(c,p){if(!CALL||CALL.c!==c||p.to!=sess.user.id)return;const k=p.from;
try{if(p.kind=='offer'){closePeer(k);const pc=getPc(k);await pc.setRemoteDescription(p.data);await flush(k);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(k,'answer',{type:a.type,sdp:a.sdp})}
else if(p.kind=='answer'){const pc=CALL.pcs[k];if(pc&&pc.signalingState=='have-local-offer'){await pc.setRemoteDescription(p.data);await flush(k)}}
else if(p.kind=='ice'){const pc=CALL.pcs[k];if(pc&&pc.remoteDescription)await pc.addIceCandidate(p.data).catch(()=>{});else if(CALL.pend[k])CALL.pend[k].push(p.data)}}catch(e){}}
function callUI(){if(!CALL){const b=document.getElementById('callbar');if(b)b.remove();return}
let b=document.getElementById('callbar');if(!b){b=document.createElement('div');b.id='callbar';document.body.appendChild(b)}
const st=CALL.c.state,me=sess.user.id,keys=Object.keys(st).filter(k=>k!=me);
const av=(name,ok,k)=>`<span class="av" style="background:hsl(${hue(name)} 55% 45%)">${esc((name||'?')[0].toUpperCase())}<i class="${ok?'ok':''}"></i></span>`;
b.innerHTML=`<div class="rw"><div><b>📞 ${esc(CALL.label)}</b> <span class="mu" id="ctm">00:00</span></div><span class="mu">${keys.length?(keys.length+1)+' wamo':'Inasubiri...'}</span></div><div style="margin:8px 0;display:flex;flex-wrap:wrap">${av('Mimi',true)}${keys.map(k=>av(st[k][0].name,CALL.st[k]=='connected',k)).join('')}</div><div class="rw"><button class="btn sm ${CALL.muted?'rdb':'gh'}" onclick="muteCall()">${CALL.muted?'🔇 Umenyamazishwa':'🎤 Mic imewashwa'}</button><button class="btn sm rdb" onclick="hangup()">📵 Kata simu</button></div>`}
function muteCall(){if(!CALL)return;CALL.muted=!CALL.muted;CALL.stream.getAudioTracks().forEach(t=>t.enabled=!CALL.muted);callUI()}
function hangup(quiet){if(!CALL)return;const C=CALL;CALL=null;clearInterval(C.tm);clearInterval(C.ringT);
Object.keys(C.pcs).forEach(k=>{try{C.pcs[k].close()}catch(e){}const a=document.getElementById('au'+k);if(a)a.remove()});
C.stream.getTracks().forEach(t=>t.stop());
if(C.room=='group'){C.c.ch.untrack()}else{if(C.ringing&&rr)rr.send({type:'broadcast',event:'cancel',payload:{room:C.room}});sb.removeChannel(C.c.ch);delete calls[C.room]}
callUI();updInfo()}
function ringSend(p){if(rr)rr.send({type:'broadcast',event:'ring',payload:p})}
async function callCC(){const id=sess.user.id,room='cc-'+id,p={to:'admin',room,name:D.me.username,from:id};
if(!await joinCall(room,'Customer Care'))return;CALL.ringing=true;ringSend(p);toast('Inapiga Customer Care...');
CALL.ringT=setInterval(()=>{if(!CALL)return;if(Object.keys(CALL.pcs).length){CALL.ringing=false;clearInterval(CALL.ringT);return}
if(Date.now()-CALL.start>45000){hangup();toast('Hakuna aliyepokea. Tuma ujumbe, tutakujibu hivi karibuni.');return}ringSend(p)},4000)}
async function callUser(id,name){const room='cc-'+id;if(!await joinCall(room,name||'Mteja'))return;CALL.ringing=true;const p={to:id,room,name:D.me.username+' (Customer Care)',from:sess.user.id};ringSend(p);
CALL.ringT=setInterval(()=>{if(!CALL)return;if(Object.keys(CALL.pcs).length){CALL.ringing=false;clearInterval(CALL.ringT);return}if(Date.now()-CALL.start>45000){hangup();toast('Mteja hajapokea');return}ringSend(p)},4000)}
function onRing(p){if(!p||p.from==sess.user.id)return;if(!((p.to=='admin'&&isAdm())||p.to==sess.user.id))return;if(CALL)return;
RING=p;let m=document.getElementById('ringm');if(!m){m=document.createElement('div');m.id='ringm';m.className='ringm';document.body.appendChild(m);beep(660);setTimeout(()=>beep(880),300)}
m.innerHTML=`<div class="rw"><div><b><span class="pulse">📞</span> ${esc(p.name)} anakupigia</b><div class="mu">Simu ya live ya eArena</div></div></div><div class="rw" style="margin-top:10px"><button class="btn rdb" onclick="closeRing()">Kataa</button><button class="btn" onclick="acceptRing()">Pokea</button></div>`;
clearTimeout(ringTm);ringTm=setTimeout(closeRing,9000)}
function closeRing(){clearTimeout(ringTm);RING=null;const m=document.getElementById('ringm');if(m)m.remove()}

/* ===== BOT: ujumbe wa ratiba ===== */
let BOT=[],botLoaded=false;
async function loadBot(){const{data,error}=await sb.from('bot_messages').select('*').order('created_at');BOT=error?[]:(data||[]);botLoaded=true;if(adm&&atab=='bt')draw()}
function btAdm(){if(!botLoaded){loadBot();return '<p class="mu">Inapakia...</p>'}
return `<div class="card"><b>Ujumbe mpya wa Bot</b><textarea id="bb" rows="3" maxlength="400" placeholder="Ujumbe (inatumwa kama 🤖 eArena Bot)"></textarea><label>Utumwe kila dakika ngapi? (chini kabisa 30)</label><input id="bm" type="number" value="180" min="30"><button class="btn" style="width:100%" onclick="saveBot()">Hifadhi</button></div><p class="mu">Bot hutuma saa 1 asubuhi hadi saa 5 usiku tu. Pia hutuma matukio ya mashindano na kumbusho la code kiotomatiki.</p>`+BOT.map(m=>`<div class="card"><div>${esc(m.body)}</div><div class="mu">kila dakika ${m.every_minutes} · ${m.active?'inatuma':'imezimwa'}</div><div class="rw" style="margin-top:8px"><button class="btn sm gh" onclick="togBot('${m.id}',${!m.active})">${m.active?'Zima':'Washa'}</button><button class="btn sm rdb" onclick="delBot('${m.id}')">Futa</button></div></div>`).join('')}
async function saveBot(){const b=V('bb').trim(),m=Math.max(30,+V('bm')||180);if(!b)return toast('Andika ujumbe');const{error}=await sb.from('bot_messages').insert({body:b,every_minutes:m});error?toast(error.message):(toast('Imehifadhiwa'),loadBot())}
async function togBot(i,v){const{error}=await sb.from('bot_messages').update({active:v}).eq('id',i);error?toast(error.message):loadBot()}
async function delBot(i){const{error}=await sb.from('bot_messages').delete().eq('id',i);error?toast(error.message):loadBot()}
</script></body></html>
